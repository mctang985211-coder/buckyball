# bb-verify — verify-runner CI workflow（Phase 3：持久化 CI 工作区模式）
#
# Phase 3 变更（2026-08-30，对齐上游 .github/workflows/check.yaml 的持久化模式）：
#   验证本体不再在 runner _work 的临时 checkout 里执行，而是固定使用本机持久化根
#   /home/ROXY/bb-verify/buckyball（由 ci/bootstrap-persistent-root.sh 一次性
#   bootstrap：clone + 全量子模块 + nix build + bbdev api venv + bebop spike +
#   compiler/workload 冷树首构）。理由：
#   - 本机约束：执行依赖用户目录内已初始化的环境（热 nix store / 热构建树），
#     runner _work 只做轻量编排（生成 task-prompt、staging 插件、跑 dsh）。
#   - 上游先例：check.yaml 同样用持久化检出（~/Code/buckyball + ci_repo_lock.sh
#     prepare）+ 每 run 增量跑 nix build / bbdev config --install / compiler
#     --build / workload --build / bebop-bemu --batch。本 workflow 的 provision
#     序列与上游一致，实测热树各步耗时见步骤注释（首次 bootstrap 见脚本头注）。
#   - 此前 dispatch 的教训：_work 干净 checkout 缺子模块 → bbdev exec 命中空目录
#     EISDIR/126（run 33263669829 的 FAIL 评论）；以及调试行 `ls result/bin |
#     head -3` 在 set -euo pipefail 下因 Broken pipe 造成假失败（run
#     33264657589）。持久化根 + 去掉该调试行后两类问题一并消除。
#
# 机器相关（self-hosted runner 就是这台机器，详见 ci/runner-setup.md）：
#   - /home/ROXY/code/deepseek-harness   — dsh harness 本机检出（pnpm dsh, v0.1.1-rc.2）
#   - /home/ROXY/code/bb_work/dsh-plugin — dsh-plugin 本机检出；workflow 从该路径把
#     verify-runner 复制进 runner.temp 再构建（本机分支领先 origin，git clone 远程
#     拿不到当前工作区状态，故不用远程 clone）。
#   - bbdev 不在宿主 PATH 上：verify-runner 按 §11 三级解析回退 `nix develop -c
#     bbdev`（cwd=repoPath=持久化根），只需 nix/gh/pnpm/node 可达 —— runner
#     service 的 PATH 很小，由 Fix PATH 步骤补齐。
#   - 安全纪律：全文件无任何明文 key。LLM key 只经 repo secret OPENCODE_API_KEY
#     注入（Run verify-runner 步骤 env）；provider 配置用 apiKeyEnv 引用同名环境
#     变量（见 ci/settings.ci.yaml）。

name: bb-verify

on:
  workflow_dispatch:            # 路线图 ②：最小实现先手动触发（《探索文档》§12）
    inputs:
      pr_number: { required: true, type: number }
  # 路线图 ③：pull_request 触发，Phase 3 已于 2026-08-30 在 PR #1 跑绿
  # （run 33270283864，VERDICT: PASS）后启用。安全提醒：self-hosted runner 对本机
  # 有完全访问权，本仓库 PR 事件只会来自本仓库自己的分支；**不要**把本 workflow
  # 用于接收陌生外部 fork 的 PR（runner-setup.md §4）。
  pull_request:
    types: [opened, synchronize]

# 持久化根是共享可变状态：同一时刻只允许一个 run 对其做 prepare + 增量构建。
# concurrency 串行化 + 步骤内 flock 双保险（concurrency 只在 GitHub 侧排队，
# flock 防的是本机其他入口，如人工调试）。
concurrency:
  group: bb-verify-persistent-root
  cancel-in-progress: false

jobs:
  verify:
    runs-on: cpu-server         # self-hosted label：nix 环境与 bbdev 都在这台机器上
    env:
      BB_VERIFY_ROOT: /home/ROXY/bb-verify/buckyball
    steps:
      # 只为拿到 $GITHUB_WORKSPACE 存放 task-prompt.md / pr-context.json，以及
      # 后续步骤引用的 runner 侧文件；不再在这里检出 PR 代码/子模块（持久化根
      # 负责），也不再在这里跑任何构建。
      - uses: actions/checkout@v4

      # runner service 的 systemd PATH 很小（不含 nix/pnpm/node 所在目录，
      # 本机实测：nix=/nix/var/nix/profiles/default/bin，pnpm/node=/home/ROXY/.local/bin）。
      # GITHUB_PATH 只对后续步骤生效，故必须是第一步。
      - name: Fix PATH for the runner service
        run: |
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "/home/ROXY/.local/bin"             >> "$GITHUB_PATH"

      - name: Check toolchain, local prerequisites and secret
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}   # 仅做非空检查，绝不回显
        run: |
          set -euo pipefail
          for tool in nix gh pnpm node; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not on PATH"; exit 1; }
          done
          for path in \
            /home/ROXY/code/deepseek-harness \
            /home/ROXY/code/bb_work/dsh-plugin/verify-runner/ci/settings.ci.yaml \
            "$BB_VERIFY_ROOT/.git" \
            "$BB_VERIFY_ROOT/bbdev/api/.venv/bin/motia" \
            "$BB_VERIFY_ROOT/bebop/src/nodes/bemu/native/spike/configure.ac" ; do
            [ -e "$path" ] || {
              echo "::error::missing local path: $path"
              echo "::error::持久化根未 bootstrap 或一次性产物缺失 —— 在本机跑一次" \
                   "dsh-plugin/verify-runner/ci/bootstrap-persistent-root.sh"
              exit 1; }
          done
          [ -n "$OPENCODE_API_KEY" ] || {
            echo "::error::repo secret OPENCODE_API_KEY 未配置（人工闸门 ②）"; exit 1; }

      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ inputs.pr_number || github.event.pull_request.number }}
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,files > pr-context.json
          { echo "验证 PR #$PR。PR 上下文（含描述中的证据清单）如下："; \
            cat pr-context.json; } > task-prompt.md

      # 持久化根 prepare（flock + fetch PR ref + detach checkout + 增量 submodule）。
      # 为什么不复用上游 .github/scripts/ci_repo_lock.sh prepare：
      #   1) 它的 repo_reset 对主仓 git clean -ffd 且对 bbdev/bebop/buddy-mlir
      #      reset --hard + clean -ffd —— 会把热树上的全部增量构建产物（buddy-mlir
      #      build/、bb-tests/workloads/build/、.venv、spike 等 untracked 内容）每次
      #      清空，持久化预热就被抵消了；本 workflow 的验证路径靠 batch 的
      #      --clean-before 保证测试产物干净，主仓不整体 clean 是有意的取舍。
      #   2) 它的锁目录写死 /tmp/buckyball-ci（多用户机器上 /tmp 归属有冲突史），
      #      且配套 setproxy.sh 是上游的网络假设（ALL_PROXY=127.0.0.1:7890），本机
      #      不适用。这里用 /home/ROXY/bb-verify 下的 flock 文件，语义等价（prepare
      #      = 拿锁后独占切换检出）。
      # 子模块处理（有意的两层设计）：
      #   a) 根仓 `git submodule update --init`（非递归）——把 18 个一级子模块对齐
      #      到 PR head 记录的指针；树在 bootstrap 时已全量 init，这里全是秒级
      #      no-op。不用 --recursive 的原因：会递归进 buddy-mlir 的嵌套子模块
      #      riscv-gnu-toolchain/tt-mlir（各数 GB，验证路径完全用不到——compiler
      #      构建脚本只引用 llvm），每次 run 都发起大 clone 既慢又是网络单点。
      #   b) buddy-mlir 的嵌套 llvm 子模块单独守卫：compiler 构建硬依赖
      #      llvm/llvm 源码；bootstrap 时已按 pinned commit 装好，这里只在缺失时
      #      才补（shallow fetch by sha，见 bootstrap 脚本）。
      # 检出后校验 HEAD == PR head sha，防止 race（PR 被 force-push 等）。
      - name: Prepare persistent repo (flock + PR head + incremental submodules)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR=${{ inputs.pr_number || github.event.pull_request.number }}
          WANT_SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          mkdir -p /home/ROXY/bb-verify
          exec 9>/home/ROXY/bb-verify/bb-verify.lock
          flock 9
          git -C "$BB_VERIFY_ROOT" fetch --force origin "refs/pull/${PR}/head"
          git -C "$BB_VERIFY_ROOT" checkout --detach --force FETCH_HEAD
          git -C "$BB_VERIFY_ROOT" submodule update --init
          if [ ! -f "$BB_VERIFY_ROOT/compiler/thirdparty/buddy-mlir/llvm/llvm/CMakeLists.txt" ]; then
            git -C "$BB_VERIFY_ROOT/compiler/thirdparty/buddy-mlir" submodule update --init llvm
          fi
          HAVE_SHA=$(git -C "$BB_VERIFY_ROOT" rev-parse HEAD)
          flock -u 9
          if [ "$HAVE_SHA" != "$WANT_SHA" ]; then
            echo "::error::persistent root at ${HAVE_SHA:0:8}, expected PR head ${WANT_SHA:0:8}"
            exit 1
          fi
          echo "persistent root at $(git -C "$BB_VERIFY_ROOT" log --oneline -1)"

      # 每 run 的 provision 序列（= 上游 check.yaml 的 chip-check 顺序，全部在持久
      # 化根内增量执行；2026-08-30 持久化根实测：nix build 4.5s、config --install
      # 15s；compiler/workload 冷树首构耗时见 bootstrap 脚本头注，热树增量远快）。
      # 注意不放 `ls result/bin | head -3` 之类调试行 —— pipefail 下 head 提前关闭
      # 管道会让 ls 以 EPIPE 退出造成假失败（run 33264657589 教训）。
      - name: Provision persistent root (nix build + bbdev config/compiler/workload)
        run: |
          set -euo pipefail
          cd "$BB_VERIFY_ROOT"
          echo "::group::nix build"; time nix build; echo "::endgroup::"
          echo "::group::bbdev config --install"
          time nix develop -c bbdev config --install
          echo "::endgroup::"
          echo "::group::bbdev compiler --build (incremental)"
          time nix develop -c bbdev compiler --build '--chip toy'
          echo "::endgroup::"
          echo "::group::bbdev workload --build (incremental)"
          time nix develop -c bbdev workload --build '--chip toy'
          echo "::endgroup::"

      - name: Stage dsh-plugin from the local checkout and build verify-runner
        run: |
          set -euo pipefail
          DSH_PLUGIN_DIR="$RUNNER_TEMP/dsh-plugin"
          mkdir -p "$DSH_PLUGIN_DIR"
          # 从本机检出复制（cp 会带上未提交的新文件，这正是 Phase 2 物料所需要的）；
          # node_modules/lib 一并重装重建，CI 验证的是干净构建。
          cp -a /home/ROXY/code/bb_work/dsh-plugin/verify-runner "$DSH_PLUGIN_DIR/verify-runner"
          rm -rf "$DSH_PLUGIN_DIR/verify-runner/node_modules" "$DSH_PLUGIN_DIR/verify-runner/lib"
          cd "$DSH_PLUGIN_DIR/verify-runner"
          pnpm install
          pnpm build
          echo "DSH_PLUGIN_DIR=$DSH_PLUGIN_DIR" >> "$GITHUB_ENV"

      - name: Prepare a fresh DSH_HOME with the LLM provider settings
        run: |
          set -euo pipefail
          DSH_LOCAL="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_LOCAL"
          # Phase 0 教训：CI 的 DSH_HOME 是全新的，没有这份 settings.yaml LLM 解析
          # 起不来。文件不含 key，key 只经 OPENCODE_API_KEY 环境变量注入。
          cp "$DSH_PLUGIN_DIR/verify-runner/ci/settings.ci.yaml" "$DSH_LOCAL/settings.yaml"
          echo "DSH_HOME=$DSH_LOCAL" >> "$GITHUB_ENV"

      - name: Install dsh plugins (headless profile)
        run: |
          cd /home/ROXY/code/deepseek-harness
          pnpm dsh plugin --profile headless add "$DSH_PLUGIN_DIR/verify-runner"

      - name: Write plugin config (repoPath = the persistent buckyball root)
        run: |
          mkdir -p "$DSH_HOME/profiles/headless"
          # repoPath 指向持久化根（已 prepare 到 PR head 并完成 provision）——
          # verify-runner 的 bbdev 三件套都以它为 cwd 解析（nix develop -c bbdev）。
          cat > "$DSH_HOME/profiles/headless/cordis.patch.yml" <<EOF
          - id: tool-verify-runner
            config:
              repoPath: $BB_VERIFY_ROOT
              taskDir:  $RUNNER_TEMP/verify-tasks
          EOF

      # verdict→退出码一致性（2026-08-30 修复）：此前 headless 会话 completed 退出 0，
      # 贴出 VERDICT: FAIL 的轮次 job 仍绿。修复后：先让会话完整跑完（PR 评论回贴
      # 发生在会话内部，由 agent 的 gh pr comment 完成——结论必须先贴上 PR 再让 job
      # 变红），再对捕获的 stdout 解析 VERDICT 裁决本步骤退出码：
      #   首个 ^VERDICT: (PASS|FAIL) 行 → PASS 且会话 exit 0 → 本步骤 exit 0（job 绿）；
      #   VERDICT: FAIL 或解析不到 VERDICT → exit 1（job 红，宁红不假绿）。
      - name: Run verify-runner
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}   # zen go / qwen3.8-flash
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_STDOUT: ${{ runner.temp }}/verify-stdout.log
          VERIFY_STDERR: ${{ runner.temp }}/verify-stderr.log
        run: |
          cd /home/ROXY/code/deepseek-harness
          # dsh headless 的进程退出码只反映会话是否正常完成（completed → 0），
          # 不反映 PASS/FAIL（src/prompt.ts 约定）；结论由最终回答的 VERDICT 行表达。
          set +e
          pnpm dsh --profile headless "$(cat "$GITHUB_WORKSPACE/task-prompt.md")" \
            > "$VERIFY_STDOUT" 2> "$VERIFY_STDERR"
          DSH_RC=$?
          set -euo pipefail
          cat "$VERIFY_STDOUT"
          cat "$VERIFY_STDERR" >&2
          # ==== verdict-gate BEGIN (stub test extracts this block verbatim; keep in sync) ====
          LINE=$(grep -m1 -E '^VERDICT:[[:space:]]*(PASS|FAIL)' "$VERIFY_STDOUT" || true)
          VERDICT=$(printf '%s\n' "$LINE" | sed -n -E 's/^VERDICT:[[:space:]]*(PASS|FAIL).*/\1/p')
          echo "verdict-gate: parsed VERDICT=${VERDICT:-<none>}, dsh session exit=${DSH_RC}"
          case "$VERDICT" in
            PASS)
              if [ "$DSH_RC" -ne 0 ]; then
                echo "::error::VERDICT says PASS but dsh session exited ${DSH_RC} -- failing (no fake green)"
                exit 1
              fi
              echo "verdict-gate: PASS -- job green"
              ;;
            FAIL)
              echo "::error::VERDICT: FAIL -- verification failed (see output above and the PR comment)"
              exit 1
              ;;
            *)
              echo "::error::no 'VERDICT: PASS|FAIL' line found in headless output -- treated as FAIL (no fake green)"
              exit 1
              ;;
          esac
          # ==== verdict-gate END ====

      - name: Archive session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-sessions
          path: ${{ runner.temp }}/dsh-home/sessions
