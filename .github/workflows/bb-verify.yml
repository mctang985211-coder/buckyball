# bb-verify — verify-runner CI workflow（Phase 3：持久化 CI 工作区模式）
#
# ⚠ 定位声明（合规审计 2026-09-06）：本文件与其同目录的 bootstrap-persistent-root.sh /
#   runner-setup.md 是 **fork/本机部署物料，不是上游交付物**。上游 DangoSys/buckyball 里没有
#   bb-verify.yml；本 workflow 的上游对照物只有两份：.github/workflows/check.yaml 与
#   .github/workflows/regression.yml（本次审计 pin = 9bb40565）。凡与本文件冲突的上游事实，
#   以那两份为准；本文件出现的本机路径 / label / secret 名 / 持久化根都是这台机器的部署细节。
#
# Phase 3 变更（2026-08-30，对齐上游 .github/workflows/check.yaml 的持久化模式）：
#   验证本体不再在 runner _work 的临时 checkout 里执行，而是固定使用本机持久化根
#   /home/ROXY/bb-verify/buckyball（由 ci/bootstrap-persistent-root.sh 一次性
#   bootstrap：clone + 全量子模块 + nix build + bbdev api venv + bebop spike +
#   compiler/workload 冷树首构）。理由：
#   - 本机约束：执行依赖用户目录内已初始化的环境（热 nix store / 热构建树），
#     runner _work 只做轻量编排（生成 task-prompt、staging 插件、跑 dsh）。
#   - 上游先例：check.yaml 同样用持久化检出（~/Code/buckyball + ci_repo_lock.sh
#     prepare）+ 每 run 增量跑 nix build / bbdev config --install / compiler
#     --build / workload --build / bebop-bemu --batch。本 workflow 的 provision
#     序列与上游一致，实测热树各步耗时见步骤注释（首次 bootstrap 见脚本头注）。
#   - 此前 dispatch 的教训：_work 干净 checkout 缺子模块 → bbdev exec 命中空目录
#     EISDIR/126（run 33263669829 的 FAIL 评论）；以及调试行 `ls result/bin |
#     head -3` 在 set -euo pipefail 下因 Broken pipe 造成假失败（run
#     33264657589）。持久化根 + 去掉该调试行后两类问题一并消除。
#
# 机器相关（self-hosted runner 就是这台机器，详见 ci/runner-setup.md）：
#   - /home/ROXY/code/deepseek-harness   — dsh harness 本机检出（pnpm dsh, v0.1.1-rc.2）
#   - /home/ROXY/code/bb_work/dsh-plugin — dsh-plugin 本机检出；workflow 从该路径把
#     verify-runner 复制进 runner.temp 再构建（本机分支领先 origin，git clone 远程
#     拿不到当前工作区状态，故不用远程 clone）。
#   - bbdev 不在宿主 PATH 上：verify-runner 按 §11 三级解析回退 `nix develop -c
#     bbdev`（cwd=repoPath=持久化根），只需 nix/gh/pnpm/node 可达 —— runner
#     service 的 PATH 很小，由 Fix PATH 步骤补齐。
#   - 安全纪律：全文件无任何明文 key。LLM key 只经 repo secret DEEPSEEK_API_KEY
#     注入（Run verify-runner 步骤 env）；provider 配置用 apiKeyEnv 引用同名环境
#     变量（见 ci/settings.ci.yaml）。
#
# 2026-09-06 确定性预判改造：stage 推断 / 证据清单 schema 校验 / 模型绑定三源检查 /
# slices 证据查证 / perf 轮上轮 probe 取证由 verify-runner/scripts/ 下五个纯 node 脚本在「Deterministic
# verdict inputs」步骤产出并注入 task-prompt.md（prompt.ts 只消费不重新判定）；
# Run verify-runner 之后新增双门禁：评论在场门禁（comments∪reviews 缺 VERDICT 首行
# 即红，r4 假绿事故双保险）与只读门禁（会话前后 tracked diff 逐字节比对）。
#
# 2026-09-06 CI 基建加固轮（见 DELIVERY.md §14）：
#   - 失败回流（VERDICT: INFRA）：Prepare / Deterministic verdict inputs / Provision /
#     Stage dsh-plugin 四步带 id 且把输出 tee 进 $RUNNER_TEMP/steplogs/<id>.log；末尾新增
#     「Report failure to the PR」步（if: failure()，continue-on-error），当本轮时间窗内
#     PR comments∪reviews **没有** 真实结论（^VERDICT: (PASS|FAIL)）时，剥 ANSI 取首条真错误
#     行 + 失败步骤名，贴一条首行 `VERDICT: INFRA` 的评论（带隐藏 marker，同 run 重入走 PATCH
#     幂等）。
#   - **契约（排它性）**：INFRA 只在「基础设施失败」时贴，不判 PR 内容。verdict-gate
#     (grep PASS|FAIL)、回退查询 (test PASS|FAIL)、评论在场门禁 (test PASS|FAIL) 三处正则
#     都只认 PASS|FAIL，故 `VERDICT: INFRA` 首行不被任何门禁当作结论——INFRA 与 PASS|FAIL 三处
#     排它，消费方（人 / dsh / 路线图）见 INFRA 应**重发 dispatch** 而非读作验证结果。
#   - report 伴生作业（hosted ubuntu-latest）：覆盖 runner 已死、verify 作业内的 3b 步根本
#     跑不到的场景，见下。verify 与 report 复用同一 marker 幂等，至多一条 INFRA 评论。
#   - **「至多一条」是无条件的，去重键 = run_id**（2026-09-07 受控红后定稿）：marker 只含
#     `run=<id>`，attempt 记在评论正文里做审计。所以同一条 run 全程最多一条 INFRA，重跑
#     （attempt+1）走 PATCH 更新同一条、正文更新而非再贴。写路径分工：机内回流步有
#     per-step tee 日志 = 权威归因人；hosted report 只在「机内没贴上」时独立贴，且面对已有
#     条目时**只升级占位错误行、绝不覆盖已锚定好的归因**（扁平 job 日志没有可靠的步边界）。
#   - **消费方全景 5 处，第 5 处刻意不对称**：workflow 内 4 处（verdict-gate grep / stdout
#     解析后的 PR 回退查询 / 评论在场门禁 / 两处站开探测都只认 PASS|FAIL），外加
#     scripts/bb-verify-watchdog.sh 的「completed 无结论」判据认 PASS|FAIL|**INFRA**——因为
#     watchdog 的语义是「这条 run 有没有留下任何结论」，INFRA 也算留痕（它已贴则不再补报）；
#     而 workflow 侧把 INFRA 排除在结论之外，是为了让 hosted report 能 PATCH 机内已贴的那一条。
#     这个不对称是有意的，两侧各自的正则都不得向对方看齐。
#   - **单作业原因** = 单 runner slot（本机只有 amax 一台 self-hosted）+ 单一可变持久根
#     /home/ROXY/bb-verify/buckyball（prepare 里 flock 独占切换检出）+ 单一结论通道
#     （一个 PR 一次只应有一个 verdict 作者）。这不是「热树不能被多作业复用」——是这三条
#     单资源约束决定的单 verify 作业；report 作业跑在 GitHub 托管 runner 上，不占本机 slot、
#     不碰持久根，只读 API。

name: bb-verify

# 最小权限：读代码、写 PR 评论（verdict / INFRA 回流）、读 actions run/job（verdict 回退
# 查询时间窗 + report 作业拉 verify 快照）。
permissions:
  contents: read
  pull-requests: write
  actions: read

# PR 号一次算好，供全 job（含 report）复用，替代此前两处
# `${{ inputs.pr_number || github.event.pull_request.number }}` 重算。
# （此前的 HEAD_SHA 是死码：全文件无一处引用，检出 sha 由 prepare 步现取现比，故删除。）
env:
  PR: ${{ inputs.pr_number || github.event.pull_request.number }}


on:
  workflow_dispatch:            # 路线图 ②：最小实现先手动触发（《探索文档》§12）
    inputs:
      pr_number: { required: true, type: number }
      # 路线图 ④：分层门禁。merge=门禁层（快，bemu 全批）；complete=重验证（手动 dispatch
      # 专用：叠加 pk-tests 与 verilator）。pull_request 自动触发时 inputs 为空，
      # Resolve PR context 步骤缺省 LAYER=merge。
      layer:
        description: 'Verification layer (merge = fast gate, complete = heavy re-verify)'
        type: choice
        options: [merge, complete]
        default: merge
        required: false
  # 路线图 ③：pull_request 触发，Phase 3 已于 2026-08-30 在 PR #1 跑绿
  # （run 33270283864，VERDICT: PASS）后启用。安全提醒：self-hosted runner 对本机
  # 有完全访问权，本仓库 PR 事件只会来自本仓库自己的分支；**不要**把本 workflow
  # 用于接收陌生外部 fork 的 PR（runner-setup.md §4）。
  pull_request:
    types: [opened, synchronize]

# 持久化根是共享可变状态：同一时刻只允许一个 run 对其做 prepare + 增量构建。
# concurrency 串行化 + 步骤内 flock 双保险（concurrency 只在 GitHub 侧排队，
# flock 防的是本机其他入口，如人工调试）。
concurrency:
  group: bb-verify-persistent-root
  cancel-in-progress: false

jobs:
  verify:
    runs-on: cpu-server         # self-hosted label：nix 环境与 bbdev 都在这台机器上
    # 基线：merge 层 6-31min，complete 层 ~40-70min；bbdev 自带轮询上限 24h，故
    # 由 job 侧给出余量充足但确实有效的天花板。
    timeout-minutes: 180
    env:
      BB_VERIFY_ROOT: /home/ROXY/bb-verify/buckyball
    steps:
      # 只为拿到 $GITHUB_WORKSPACE 存放 task-prompt.md / pr-context.json，以及
      # 后续步骤引用的 runner 侧文件；不再在这里检出 PR 代码/子模块（持久化根
      # 负责），也不再在这里跑任何构建。
      - uses: actions/checkout@v4

      # runner service 的 systemd PATH 很小（不含 nix/pnpm/node 所在目录，
      # 本机实测：nix=/nix/var/nix/profiles/default/bin，pnpm/node=/home/ROXY/.local/bin）。
      # GITHUB_PATH 只对后续步骤生效，故必须是第一步。
      - name: Fix PATH for the runner service
        run: |
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "/home/ROXY/.local/bin"             >> "$GITHUB_PATH"

      - name: Check toolchain, local prerequisites and secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}   # 仅做非空检查，绝不回显
        run: |
          set -euo pipefail
          for tool in nix gh pnpm node; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not on PATH"; exit 1; }
          done
          # E1 evidence (audit 2026-08-31): record which node/pnpm the job actually
          # resolves -- research §7.1 says bare `pnpm dsh` breaks on the flake node
          # v24.18.0, yet this workflow runs it green; hypothesis is that the runner
          # PATH hits ~/.local/bin/node (v24.20.0) instead. Log version + path.
          echo "node at $(command -v node): $(node --version)"
          echo "pnpm at $(command -v pnpm): $(pnpm --version)"
          for path in \
            /home/ROXY/code/deepseek-harness \
            /home/ROXY/code/bb_work/dsh-plugin/verify-runner/ci/settings.ci.yaml \
            "$BB_VERIFY_ROOT/.git" \
            "$BB_VERIFY_ROOT/bbdev/api/.venv/bin/motia" \
            "$BB_VERIFY_ROOT/bebop/src/nodes/bemu/native/spike/configure.ac" ; do
            [ -e "$path" ] || {
              echo "::error::missing local path: $path"
              echo "::error::持久化根未 bootstrap 或一次性产物缺失 —— 在本机跑一次" \
                   "dsh-plugin/verify-runner/ci/bootstrap-persistent-root.sh"
              exit 1; }
          done
          [ -n "$DEEPSEEK_API_KEY" ] || {
            echo "::error::repo secret DEEPSEEK_API_KEY 未配置（人工闸门 ②）"; exit 1; }

      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # PR 取自 workflow 级 env（顶部一次算好）；此处只补 LAYER：
          # 路线图 ④：layer 只能来自 workflow_dispatch 输入；pull_request 事件固定 merge 层。
          LAYER=${{ inputs.layer || 'merge' }}
          echo "LAYER=$LAYER" >> "$GITHUB_ENV"
          # comments,reviews 供 slices-gate 查证（PASS 报告可能落在 review 面）；
          # headRefOid 供「报告内 head sha == 当前 head」核对；task-prompt.md
          # 由持久化根 prepare 之后的 Deterministic verdict inputs 步骤组装。
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json title,body,files,headRefOid,comments,reviews > pr-context.json

      # 持久化根 prepare（flock + fetch PR ref + detach checkout + 增量 submodule）。
      # 为什么不复用上游 .github/scripts/ci_repo_lock.sh prepare：
      #   1) 它的 repo_reset 对主仓 git clean -ffd 且对 bbdev/bebop/buddy-mlir
      #      reset --hard + clean -ffd —— 会把热树上的全部增量构建产物（buddy-mlir
      #      build/、bb-tests/workloads/build/、.venv、spike 等 untracked 内容）每次
      #      清空，持久化预热就被抵消了；本 workflow 的验证路径靠 batch 的
      #      --clean-before 保证测试产物干净，主仓不整体 clean 是有意的取舍。
      #   2) 它的锁目录写死 /tmp/buckyball-ci（多用户机器上 /tmp 归属有冲突史），
      #      且配套 setproxy.sh 是上游的网络假设（ALL_PROXY=127.0.0.1:7890），本机
      #      不适用。这里用 /home/ROXY/bb-verify 下的 flock 文件，语义等价（prepare
      #      = 拿锁后独占切换检出）。
      # 子模块处理（有意的两层设计）：
      #   a) 根仓 `git submodule update --init`（非递归）——把 18 个一级子模块对齐
      #      到 PR head 记录的指针；树在 bootstrap 时已全量 init，这里全是秒级
      #      no-op。不用 --recursive 的原因：会递归进 buddy-mlir 的嵌套子模块
      #      riscv-gnu-toolchain/tt-mlir（各数 GB，验证路径完全用不到——compiler
      #      构建脚本只引用 llvm），每次 run 都发起大 clone 既慢又是网络单点。
      #   b) buddy-mlir 的嵌套 llvm 子模块单独守卫：compiler 构建硬依赖
      #      llvm/llvm 源码；bootstrap 时已按 pinned commit 装好，这里只在缺失时
      #      才补（shallow fetch by sha，见 bootstrap 脚本）。
      # 检出后校验 HEAD == PR head sha，防止 race（PR 被 force-push 等）；比对必须在
      # flock 临界区内做，出锁后锁外的一切都不再可信。
      - name: Prepare persistent repo (flock + PR head + incremental submodules)
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 输出 tee 到 per-step 日志（供 failure() 报告步提取真错误行；tee 不参与判定，
          # 内层 set -euo pipefail 保持——管道首段失败即整步失败）。PR 取自 workflow 级 env。
          mkdir -p "$RUNNER_TEMP/steplogs"
          exec > >(tee "$RUNNER_TEMP/steplogs/prepare.log") 2>&1
          WANT_SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          mkdir -p /home/ROXY/bb-verify
          exec 9>/home/ROXY/bb-verify/bb-verify.lock
          flock 9
          git -C "$BB_VERIFY_ROOT" fetch --force origin "refs/pull/${PR}/head"
          git -C "$BB_VERIFY_ROOT" checkout --detach --force FETCH_HEAD
          # 换源（bbdev/e2e → 个人 fork）后必须 sync：update --init 对已 init 的
          # 子模块不重读 .gitmodules 新 URL，会继续用 .git/config 里的旧 org URL。
          git -C "$BB_VERIFY_ROOT" submodule sync
          git -C "$BB_VERIFY_ROOT" submodule update --init
          if [ ! -f "$BB_VERIFY_ROOT/compiler/thirdparty/buddy-mlir/llvm/llvm/CMakeLists.txt" ]; then
            git -C "$BB_VERIFY_ROOT/compiler/thirdparty/buddy-mlir" submodule update --init llvm
          fi
          HAVE_SHA=$(git -C "$BB_VERIFY_ROOT" rev-parse HEAD)
          if [ "$HAVE_SHA" != "$WANT_SHA" ]; then
            echo "::error::persistent root at ${HAVE_SHA:0:8}, expected PR head ${WANT_SHA:0:8}"
            exit 1
          fi
          flock -u 9
          echo "persistent root at $(git -C "$BB_VERIFY_ROOT" log --oneline -1)"

      # 确定性预判（2026-09-06 起，stage/清单/绑定/slices 证据/perf 轮上轮 probe 五判定由脚本产出，
      # 不再是 prompt 恳求）：脚本直接跑本机检出的 verify-runner/scripts（纯 node，
      # 无构建依赖；cp -a staging 在后面的 Stage dsh-plugin 步骤才发生，故此处
      # 引用本机绝对路径而非 $DSH_PLUGIN_DIR）。判定块注入 task-prompt.md 尾部，
      # prompt.ts 只消费不重新判定；validate/binding 的 PRE-FAIL 让会话直接回贴
      # FAIL，省掉一次全批白跑。脚本非零退出 = 判定管线故障 → job 红（宁红不假绿）。
      # 必须在持久化根 prepare 之后跑：清单/绑定的检出树核对以 PR head 为准。
      - name: Deterministic verdict inputs (stage/manifest/binding/slices/perf)
        id: verdict_inputs
        run: |
          set -euo pipefail
          # tee 只用于失败回流提取错误行，不参与判定（脚本 stdout 仍进 task-prompt.md，
          # 崩溃栈走 stderr → 进 steplogs/verdict_inputs.log）。内层 set -euo pipefail 保持。
          # 注：五个判定脚本的 PRE-FAIL 行走 **stdout**（console.log），故只落在
          # task-prompt.md 里，不在本步 tee 的 stderr 日志里。回流步把 task-prompt.md 列为
          # 扫描源之一，但对该文件只用 PRE-FAIL 窄正则（文件含整份 pr-context.json，套通用
          # 错误正则会误抓 PR 散文里的 "error:"）。
          mkdir -p "$RUNNER_TEMP/steplogs"
          exec 2> >(tee "$RUNNER_TEMP/steplogs/verdict_inputs.log" >&2)
          SCRIPTS=/home/ROXY/code/bb_work/dsh-plugin/verify-runner/scripts
          { echo "验证 PR #$PR。验证层级：$LAYER（merge=门禁层；complete=重验证）。PR 上下文（含描述中的证据清单）如下："
            cat pr-context.json
            echo
            echo "===== CI 确定性判定（脚本注入，直接消费，不得重新判定）====="
            node "$SCRIPTS/infer-stage.mjs" --context pr-context.json
            node "$SCRIPTS/validate-manifest.mjs" --context pr-context.json --repo-root "$BB_VERIFY_ROOT"
            node "$SCRIPTS/binding-check.mjs" --context pr-context.json --repo-root "$BB_VERIFY_ROOT"
            node "$SCRIPTS/slices-verify.mjs" --context pr-context.json
            node "$SCRIPTS/probe-loop-check.mjs" --context pr-context.json
          } > task-prompt.md

      # 每 run 的 provision 序列（= 上游 check.yaml:123-126 的 chip-check 顺序，全部在持久
      # 化根内增量执行；2026-08-30 持久化根实测：nix build 4.5s、config --install
      # 15s；compiler/workload 冷树首构耗时见 bootstrap 脚本头注，热树增量远快）。
      # chip 不再写死 toy：本步骤只是**热树预热**（真正的验证序列由会话侧 bbdev_plan 按
      # 判定块注入的 chip 生成），但按清单 chip 预热才对那棵 chip 的构建树有用；清单缺失或
      # 非法（validate-manifest 已 PRE-FAIL）时退回 toy，并在日志里注明这是预热而非判定。
      # 注意不放 `ls result/bin | head -3` 之类调试行 —— pipefail 下 head 提前关闭
      # 管道会让 `ls` 以 EPIPE 退出造成假失败（run 33264657589 教训）。
      - name: Provision persistent root (nix build + bbdev config/compiler/workload)
        id: provision
        run: |
          set -euo pipefail
          # tee 到 per-step 日志供失败回流；exec 重定向不参与判定（内层 set -euo pipefail 保持）。
          mkdir -p "$RUNNER_TEMP/steplogs"
          exec > >(tee "$RUNNER_TEMP/steplogs/provision.log") 2>&1
          cd "$BB_VERIFY_ROOT"
          export SCRIPTS=/home/ROXY/code/bb_work/dsh-plugin/verify-runner/scripts
          PROVISION_CHIP=$(node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs"
            const { parseManifest } = await import(`file://${process.env.SCRIPTS}/manifest.mjs`)
            const body = JSON.parse(readFileSync(`${process.env.GITHUB_WORKSPACE}/pr-context.json`, "utf8")).body
            const chip = parseManifest(body).chip
            // 只做预热用 chip 选择：清单没写或该 chip 在树上无实物时退回 toy 并注明，
            // 判定侧的 chip 缺失由 validate-manifest.mjs 的 PRE-FAIL 负责，不归本步骤。
            process.stdout.write(chip !== undefined && existsSync(`${process.env.BB_VERIFY_ROOT}/examples/chips/${chip}`) ? chip : "toy")
          ')
          echo "provision chip=${PROVISION_CHIP}（仅热树预热；验证序列的 chip 以判定块注入值为准）"
          echo "::group::nix build"; time nix build; echo "::endgroup::"
          echo "::group::bbdev config --install"
          time nix develop -c bbdev config --install
          echo "::endgroup::"
          echo "::group::bbdev compiler --build (incremental)"
          time nix develop -c bbdev compiler --build "--chip ${PROVISION_CHIP}"
          echo "::endgroup::"
          echo "::group::bbdev workload --clean + --build (incremental)"
          time nix develop -c bbdev workload --clean "--chip ${PROVISION_CHIP}"
          time nix develop -c bbdev workload --build "--chip ${PROVISION_CHIP}"
          echo "::endgroup::"

      - name: Stage dsh-plugin from the local checkout and build verify-runner
        id: stage_dsh
        run: |
          set -euo pipefail
          # tee 到 per-step 日志供失败回流；exec 重定向不参与判定（内层 set -euo pipefail 保持）。
          mkdir -p "$RUNNER_TEMP/steplogs"
          exec > >(tee "$RUNNER_TEMP/steplogs/stage_dsh.log") 2>&1
          DSH_PLUGIN_DIR="$RUNNER_TEMP/dsh-plugin"
          mkdir -p "$DSH_PLUGIN_DIR"
          # 从本机检出复制（cp 会带上未提交的新文件，这正是 Phase 2 物料所需要的）；
          # node_modules/lib 一并重装重建，CI 验证的是干净构建。
          cp -a /home/ROXY/code/bb_work/dsh-plugin/verify-runner "$DSH_PLUGIN_DIR/verify-runner"
          rm -rf "$DSH_PLUGIN_DIR/verify-runner/node_modules" "$DSH_PLUGIN_DIR/verify-runner/lib"
          cd "$DSH_PLUGIN_DIR/verify-runner"
          pnpm install
          pnpm build
          echo "DSH_PLUGIN_DIR=$DSH_PLUGIN_DIR" >> "$GITHUB_ENV"

      - name: Prepare a fresh DSH_HOME with the LLM provider settings
        run: |
          set -euo pipefail
          DSH_LOCAL="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_LOCAL"
          # Phase 0 教训：CI 的 DSH_HOME 是全新的，没有这份 settings.yaml LLM 解析
          # 起不来。文件不含 key，key 只经 DEEPSEEK_API_KEY 环境变量注入。
          cp "$DSH_PLUGIN_DIR/verify-runner/ci/settings.ci.yaml" "$DSH_LOCAL/settings.yaml"
          echo "DSH_HOME=$DSH_LOCAL" >> "$GITHUB_ENV"

      - name: Install dsh plugins (headless profile)
        run: |
          cd /home/ROXY/code/deepseek-harness
          pnpm dsh plugin --profile headless add "$DSH_PLUGIN_DIR/verify-runner"

      - name: Write plugin config (repoPath = the persistent buckyball root)
        run: |
          mkdir -p "$DSH_HOME/profiles/headless"
          # repoPath 指向持久化根（已 prepare 到 PR head 并完成 provision）——
          # verify-runner 的 bbdev 三件套都以它为 cwd 解析（nix develop -c bbdev）。
          cat > "$DSH_HOME/profiles/headless/cordis.patch.yml" <<EOF
          - id: tool-verify-runner
            config:
              repoPath: $BB_VERIFY_ROOT
              taskDir:  $RUNNER_TEMP/verify-tasks
          EOF

      # 只读门禁基线：会话前的 tracked diff 快照。git diff 只覆盖 tracked 内容；
      # 子模块工作树的既有构建残留由基线吸收，会话期间的新增改动必现形。
      - name: Snapshot persistent-root diff (read-only gate baseline)
        run: git -C "$BB_VERIFY_ROOT" diff HEAD > "$RUNNER_TEMP/pre-verify.diff"

      # verdict→退出码一致性（2026-08-30 修复）：此前 headless 会话 completed 退出 0，
      # 贴出 VERDICT: FAIL 的轮次 job 仍绿。修复后：先让会话完整跑完（PR 评论回贴
      # 发生在会话内部，由 agent 的 gh pr comment 完成——结论必须先贴上 PR 再让 job
      # 变红），再对捕获的 stdout 解析 VERDICT 裁决本步骤退出码：
      #   首个 ^VERDICT: (PASS|FAIL) 行 → PASS 且会话 exit 0 → 本步骤 exit 0（job 绿）；
      #   VERDICT: FAIL 或解析不到 VERDICT → exit 1（job 红，宁红不假绿）。
      #   2026-09-06 起 stdout 解析不到时回退本 run 时间窗内的 PR 评论/评审首行
      #   VERDICT（deepseek 推理-only 收尾会让最终回答不到 stdout，run 33987743069）。
      - name: Run verify-runner
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}   # deepseek 原生 / deepseek-v4-flash
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_STDOUT: ${{ runner.temp }}/verify-stdout.log
          VERIFY_STDERR: ${{ runner.temp }}/verify-stderr.log
        run: |
          cd /home/ROXY/code/deepseek-harness
          # 2026-09-06：HF 网络路径在 CI 必死——harness http-proxy policy
          # （packages/util/http-proxy/src/policy.ts:321 withLoopback）给下游子进程
          # 重写 no_proxy 并追加带方括号的 `[::1]`，httpx 0.28.1 解析它即崩
          # （InvalidURL: Invalid port ':1]'；run 33989403205/33989896357/33990723390
          # 三轮实证 + verifier 逐项 bisect；步骤级 export 治标无效——harness 会重写）。
          # CI 模型缓存一律预置（~/.cache/huggingface），故直接全程离线：huggingface_hub
          # 离线模式在构造 HTTP 客户端之前短路，坏 no_proxy 根本不会被解析。
          # 后果语义：模型未预置时报 OfflineModeIsEnabled（确定性失败），不会走网络。
          export HF_HUB_OFFLINE=1
          # dsh headless 的进程退出码只反映会话是否正常完成（completed → 0），
          # 不反映 PASS/FAIL（src/prompt.ts 约定）；结论由最终回答的 VERDICT 行表达。
          set +e
          pnpm dsh --profile headless "$(cat "$GITHUB_WORKSPACE/task-prompt.md")" \
            > "$VERIFY_STDOUT" 2> "$VERIFY_STDERR"
          DSH_RC=$?
          set -euo pipefail
          # verdict 先解析一次（供呈现与门禁共用），再包装输出、写 summary、进 case 裁决。
          LINE=$(grep -m1 -E '^VERDICT:[[:space:]]*(PASS|FAIL)' "$VERIFY_STDOUT" || true)
          VERDICT=$(printf '%s\n' "$LINE" | sed -n -E 's/^VERDICT:[[:space:]]*(PASS|FAIL).*/\1/p')
          # per-lane/per-section 可读性（2026-09-06 加固）：把会话 stdout/stderr 折进可折叠
          # ::group::，并写一份 lane summary（$GITHUB_STEP_SUMMARY）。verdict-gate 读的是
          # $VERIFY_STDOUT 文件本身，不受这里的呈现包装影响。
          # 转义（2026-09-07）：会话输出会原样进 Actions 日志，而行首的 "::name::" 会被 runner
          # 解析成 workflow 注解（timestamp 前缀会被日志处理器剥掉后再匹配）——会话报告里引用
          # PR 散文 / 被验证方工具输出，等于给 PR 内容一个伪造 ::error::、::group::、甚至
          # ::stop-commands::<token>:: 拆掉整段日志的通道。mask_wf 把行首的命令形（含带参数
          # 的 `::error file=x::`）改写成 `[name] `：语义不变、注解面失效。只影响呈现，
          # verdict-gate 读的仍是未加工的 $VERIFY_STDOUT 文件。
          mask_wf() { sed -E 's/^::([a-zA-Z][a-zA-Z0-9-]*)([[:space:]][^:]*)?::/[\1] /'; }
          echo "::group::verify-runner session stdout"
          mask_wf < "$VERIFY_STDOUT"
          echo "::endgroup::"
          echo "::group::verify-runner session stderr"
          mask_wf < "$VERIFY_STDERR" >&2
          echo "::endgroup::"
          # step summary 是 markdown：LINE 里的反引号会拆掉本行的 inline code、`|` 会拆表格，
          # 判定块片段里的 ``` 会提前闭合代码栅栏（→ 后续内容按 markdown 渲染）。呈现前先剥。
          LINE_SAFE=$(printf '%s' "${LINE:-<none>}" | tr -d '`\r' | tr '|' '/' | cut -c1-120)
          {
            echo "### bb-verify — PR #$PR · layer=$LAYER"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| dsh session exit | \`$DSH_RC\` |"
            # 判定块（task-prompt.md 尾部）里的 lane 相关行：stage / chip / phase + 本轮
            # verdict，按 lane 语义分组呈现，供人一眼看清这次验证跑的是哪一层哪些 lane。
            echo "| 本轮 VERDICT (stdout) | \`$LINE_SAFE\` |"
            echo ""
            echo "#### 注入判定块（lane 依据）"
            echo '```'
            # 注：skippedLanes 分支已删（2026-09-07）——它是 bbdev_plan 的**运行时**返回值，
            # 只出现在会话输出/PR 报告里，五个判定脚本没有一个把它写进 task-prompt.md，
            # grep 永远打不中（死分支）。lane 裁剪的呈现归会话报告，不归这里。
            grep -aE '^\[|effective|chip|phase|layer|PRE-FAIL|VERDICT' \
              "$GITHUB_WORKSPACE/task-prompt.md" 2>/dev/null | head -60 \
              | tr -d '\r' | sed -E 's/^ *```.*$//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # ==== verdict-gate BEGIN ====
          echo "verdict-gate: parsed VERDICT=${VERDICT:-<none>}, dsh session exit=${DSH_RC}"
          case "$VERDICT" in
            PASS)
              if [ "$DSH_RC" -ne 0 ]; then
                echo "::error::VERDICT says PASS but dsh session exited ${DSH_RC} -- failing (no fake green)"
                exit 1
              fi
              echo "verdict-gate: PASS -- job green"
              ;;
            FAIL)
              echo "::error::VERDICT: FAIL -- verification failed (see output above and the PR comment)"
              exit 1
              ;;
            *)
              # 2026-09-06 缺口修复（phase4 演练 run 33987743069 实证）：deepseek 路由偶发
              # 推理-only 收尾——会话 exit 0、报告已成功贴上 PR，但最终回答不到 stdout，
              # stdout grep 假阴性。回退：取本 run 时间窗内（createdAt >= 本 run 创建时刻，
              # 排除历史轮次陈旧结论）PR comments ∪ reviews 的首行 VERDICT 作结论来源。
              echo "verdict-gate: no VERDICT line in headless stdout; falling back to this-run PR verdict"
              RUN_CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
              # gh pr view --jq 不吃 jq 的 --arg（会把 --arg/since/<值> 当位置参数 → 报
              # “accepts at most 1 arg”），故 --json 输出管道给真正的 jq 传变量。
              # 时间窗字段必须写 (.createdAt // .submittedAt)：gh pr view 的 **reviews 没有
              # createdAt**（只有 submittedAt），单取 .createdAt 对 review 恒 null → jq 里
              # null >= "<串>" 恒 false → review 面的结论永远进不了窗口（2026-09-07 实测
              # PR #26 的 review 面无 createdAt 键）。comments 侧仍有 createdAt，语义不变。
              LINE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments,reviews \
                | jq -r --arg since "$RUN_CREATED" \
                '[.comments[],.reviews[] | select((.createdAt // .submittedAt) >= $since) | .body | split("\n")[0] | select(test("^VERDICT: *(PASS|FAIL)"))] | last // empty')
              VERDICT=$(printf '%s\n' "$LINE" | sed -n -E 's/^VERDICT:[[:space:]]*(PASS|FAIL).*/\1/p')
              echo "verdict-gate fallback: PR #$PR this-run VERDICT=${VERDICT:-<none>} (window since $RUN_CREATED)"
              case "$VERDICT" in
                PASS)
                  if [ "$DSH_RC" -ne 0 ]; then
                    echo "::error::VERDICT says PASS (PR fallback) but dsh session exited ${DSH_RC} -- failing (no fake green)"
                    exit 1
                  fi
                  echo "verdict-gate: PASS (via this-run PR comment fallback) -- job green"
                  ;;
                FAIL)
                  echo "::error::VERDICT: FAIL (via this-run PR comment fallback) -- verification failed (see the PR comment)"
                  exit 1
                  ;;
                *)
                  echo "::error::no 'VERDICT: PASS|FAIL' line in headless output nor in this-run PR comments -- treated as FAIL (no fake green)"
                  exit 1
                  ;;
              esac
              ;;
          esac
          # ==== verdict-gate END ====

      # 门禁①（2026-09-06，r4 假绿事故的双保险）：VERDICT 必须真实落在 PR 的
      # comments ∪ reviews 任一面（首行 ^VERDICT: (PASS|FAIL)）——会话自称已贴
      # 不算数；缺即红。verdict-gate 已红的路径不再重复判（本步只在绿路径上跑）。
      # 时间窗（2026-09-07 补）：与 report/回流步同一口径，只认**本轮**（createdAt //
      # submittedAt >= 本 run 创建时刻）贴上的结论——查全历史会让上一轮的陈旧 PASS 替
      # 本轮的漏贴背书（假绿通道）。探测调用失败（拿不到窗口或计数）时按门禁语义**判红**
      # （宁红不假绿），与站开探测的 fail-closed 方向相反是刻意的：这里红=重发 dispatch，
      # 那里站开=不抢结论通道。
      - name: "Gate: verdict present on the PR (no fake green)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          [ -n "$RUN_CREATED" ] || { echo "::error::verdict-presence-gate: cannot read this run's created_at -- failing (no fake green)"; exit 1; }
          COUNT=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments,reviews \
            | jq -r --arg since "$RUN_CREATED" \
            '[.comments[],.reviews[] | select((.createdAt // .submittedAt) >= $since) | .body | split("\n")[0] | select(test("^VERDICT: *(PASS|FAIL)"))] | length')
          case "$COUNT" in
            ''|*[!0-9]*) echo "::error::verdict-presence-gate: verdict probe failed (got '$COUNT') -- failing (no fake green)"; exit 1;;
          esac
          echo "verdict-presence-gate: PR #$PR comments∪reviews 首行 VERDICT 条目数 = $COUNT (window since $RUN_CREATED)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no 'VERDICT: PASS|FAIL' first line in PR #$PR comments ∪ reviews **within this run's window** -- repost failed, failing (no fake green)"
            exit 1
          fi

      # 门禁②：验证会话对持久化根只读 —— 会话前后的 tracked diff 逐字节比对
      # （基线见 Snapshot 步骤；子模块既有残留不进入差集）。
      - name: "Gate: persistent root untouched by the session"
        run: |
          set -euo pipefail
          git -C "$BB_VERIFY_ROOT" diff HEAD > "$RUNNER_TEMP/post-verify.diff"
          if ! cmp -s "$RUNNER_TEMP/pre-verify.diff" "$RUNNER_TEMP/post-verify.diff"; then
            echo "::error::persistent root tracked diff changed during the session (verifier must be read-only)"
            diff "$RUNNER_TEMP/pre-verify.diff" "$RUNNER_TEMP/post-verify.diff" | head -50 || true
            exit 1
          fi
          echo "readonly-gate: persistent root diff unchanged"

      - name: Archive session logs
        if: always()
        # observability only - flaky artifact-upload resets must not flip
        # the verdict-gate semantics of a red job
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dsh-sessions
          path: ${{ runner.temp }}/dsh-home/sessions

      # 失败回流（2026-09-06 加固轮）：runner 还活着、但 job 因基础设施原因变红时（四
      # 可失败步之一崩、或 verdict-gate 判红但会话没贴上真 PASS|FAIL），把首条真错误行 +
      # 失败步骤名贴回 PR，首行 `VERDICT: INFRA`。
      #   - 排它契约：本步首行只可能是 INFRA；三处门禁正则（verdict-gate grep、回退查询
      #     test、评论在场 test）都只认 PASS|FAIL，故 INFRA 不被任何门禁当作结论，也不被
      #     本步的「已有结论则不抢通道」检测当作结论——检测正则同样是 PASS|FAIL。
      #   - continue-on-error: true —— 回流本身是尽力而为，绝不再把已红的 job 改动或掩盖
      #     原始红因；它挂了无所谓（report 伴生作业会兜底）。
      #   - 幂等：隐藏 marker `<!-- bb-verify:ci-error run=<id> -->`——**去重键只有 run**，
      #     attempt 只写进正文做审计。同一条 run 再贴（机内重入 / hosted 补报 / 重跑
      #     attempt+1）一律走 PATCH 更新同一条，PR 上始终至多一条 INFRA。
      - name: Report failure to the PR
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_PREPARE: ${{ steps.prepare.outcome }}
          FAILED_INPUTS: ${{ steps.verdict_inputs.outcome }}
          FAILED_PROVISION: ${{ steps.provision.outcome }}
          FAILED_STAGE: ${{ steps.stage_dsh.outcome }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/steplogs"
          # 1) 不抢通道：本 run 时间窗内 PR comments∪reviews 已有 ^VERDICT:(PASS|FAIL) 首行
          #    → 说明结论已由会话/门禁正常给出，INFRA 不该覆盖它。
          #    fail-closed（2026-09-07）：探测本身失败（拿不到 created_at / jq 非数字输出，
          #    常见于 API 抖动或限流）时**站开不贴**——「查不到结论」和「确实没有结论」是两件
          #    事，前者误贴会用 INFRA 盖住一条可能已经存在的真结论（report 作业仍会兜底）。
          RUN_CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .created_at)
          if [ -z "$RUN_CREATED" ]; then
            echo "report-ci-error: cannot read this run's created_at (API failure) -- standing down (fail-closed, the hosted report job still covers this)"
            exit 0
          fi
          HAS_VERDICT=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments,reviews \
            | jq --arg since "$RUN_CREATED" \
            '[.comments[],.reviews[] | select((.createdAt // .submittedAt) >= $since) | .body | split("\n")[0] | select(test("^VERDICT: *(PASS|FAIL)"))] | length')
          case "$HAS_VERDICT" in
            ''|*[!0-9]*)
              echo "report-ci-error: verdict probe failed (got '$HAS_VERDICT') -- standing down (fail-closed, no INFRA on an unknown)"
              exit 0;;
          esac
          if [ "$HAS_VERDICT" -gt 0 ]; then
            echo "report-ci-error: a real PASS|FAIL verdict already exists in this run's window -- INFRA stands down"
            exit 0
          fi
          # 2) 认失败步骤：四个可失败步哪个 outcome=failure 就报哪个名（并记下 step id 供第 3
          #    步锚定日志）；否则归为门禁/其他。
          STEP=""; STEP_ID=""
          for pair in "prepare:Prepare persistent repo" \
                      "verdict_inputs:Deterministic verdict inputs" \
                      "provision:Provision persistent root" \
                      "stage_dsh:Stage dsh-plugin / build verify-runner"; do
            id="${pair%%:*}"; label="${pair#*:}"
            case "$id" in
              prepare) oc="$FAILED_PREPARE";; inputs|verdict_inputs) oc="$FAILED_INPUTS";;
              provision) oc="$FAILED_PROVISION";; stage_dsh) oc="$FAILED_STAGE";;
            esac
            [ "$oc" = "failure" ] && { STEP="$label ($id)"; STEP_ID="$id"; break; }
          done
          STEP="${STEP:-a verification/gate step (see the failed step in the run)}"
          # 3) 剥 ANSI 取首条真错误行。**先锚定失败步自己的日志**（steplogs/<id>.log），
          #    无命中才回落到其余 glob —— 旧写法按字母序扫 *.log，prepare.log 永远排在
          #    verdict_inputs.log 之前，于是一个 verdict_inputs 的失败会被贴成 prepare 的
          #    某条瞬时 "error:"（张冠李戴，2026-09-07 修）。
          strip_ansi() { sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g'; }
          ERR_RE='(::error::|^error:|[Ee]rror:|FAILED:|ninja: build stopped|CMake Error|Traceback|\bpanic\b|command not found|not on PATH|PRE-FAIL)'
          ERR=""
          if [ -n "$STEP_ID" ] && [ -f "$RUNNER_TEMP/steplogs/$STEP_ID.log" ]; then
            ERR=$(strip_ansi < "$RUNNER_TEMP/steplogs/$STEP_ID.log" | grep -aE "$ERR_RE" | head -1)
            [ -n "$ERR" ] && echo "report-ci-error: error line anchored to steplogs/$STEP_ID.log"
          fi
          # 判定脚本的 PRE-FAIL 行只进 stdout（→ task-prompt.md），故对该文件单用窄正则。
          if [ -z "$ERR" ] && [ -f "$GITHUB_WORKSPACE/task-prompt.md" ]; then
            ERR=$(strip_ansi < "$GITHUB_WORKSPACE/task-prompt.md" \
              | grep -aE '^[[:space:]]*PRE-FAIL[: ]' | head -1)
            [ -n "$ERR" ] && echo "report-ci-error: error line anchored to task-prompt.md (PRE-FAIL)"
          fi
          if [ -z "$ERR" ]; then
            for lf in "$RUNNER_TEMP"/steplogs/*.log; do
              [ -f "$lf" ] || continue
              cand=$(strip_ansi < "$lf" | grep -aE "$ERR_RE" | head -1)
              [ -n "$cand" ] && { ERR="$cand"; echo "report-ci-error: error line from fallback glob $(basename "$lf")"; break; }
            done
          fi
          [ -n "$ERR" ] || ERR="(no matching error line captured in tee'd step logs; open the run for the raw tail)"
          # 评论体是 markdown（不是日志），::name:: 在这里不会被解析成注解，故**不**改写错误行
          # 内容——保持原样才利于归因；只截断超长行，避免评论爆炸（hosted report 作业同口径）。
          ERR="${ERR:0:400}"
          # 4) 组装评论体到文件（首行必须正是 VERDICT: INFRA，独占结论通道）。逐行 printf
          #    而非多行字符串，避免 YAML block scalar 里出现 0 缩进行。
          MARKER="<!-- bb-verify:ci-error run=$RUN_ID -->"
          BODYF="$RUNNER_TEMP/infra-body.md"
          printf 'VERDICT: INFRA\n' > "$BODYF"
          printf '\n' >> "$BODYF"
          printf '基础设施失败（不是 PR 内容的验证结论）。消费方应**重发 dispatch**，不要把本行当作验证结果。\n' >> "$BODYF"
          printf '\n' >> "$BODYF"
          printf -- '- 失败步骤：%s\n' "$STEP" >> "$BODYF"
          printf -- '- 首条错误行：%s\n' "$ERR" >> "$BODYF"
          printf -- '- Run：%s (attempt %s)\n' "$JOB_URL" "$ATTEMPT" >> "$BODYF"
          printf -- '- 来源：机内回流步（verify 作业内，有 per-step tee 日志，归因权威）\n' >> "$BODYF"
          printf -- '- 语义：VERDICT: INFRA 与 PASS/FAIL 三处门禁正则排它；此结论只表示 runner/CI 侧异常。\n' >> "$BODYF"
          printf '\n%s\n' "$MARKER" >> "$BODYF"
          # 5) 幂等：**按 run 去重**（marker 只含 run=，attempt 写在正文里做审计）。已有同 run 的
          #    INFRA 条目 → PATCH 同一条、正文更新而非再贴（重跑 attempt+1 走的就是这支）；本步
          #    有机内 per-step 日志，归因一定不比 hosted 侧差，所以这里可以无条件 PATCH。
          #    body 必须走 --input + jq -Rs 的 JSON（gh api -f 是 raw string，**不**展开 @file，
          #    会把 "@/tmp/.../infra-body.md" 这串字面量写进评论）。
          EXIST_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            | jq -sr --arg m "bb-verify:ci-error run=$RUN_ID" \
            '[ .[][] | select(.body | contains($m)) | .id ] | (last // empty)')
          if [ -n "$EXIST_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXIST_ID" \
              --input <(jq -Rs '{body:.}' "$BODYF") >/dev/null \
              && echo "report-ci-error: PATCHed existing INFRA comment id=$EXIST_ID (attempt $ATTEMPT)" \
              || echo "report-ci-error: PATCH failed (best-effort, ignored)"
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$BODYF" \
              && echo "report-ci-error: posted new INFRA comment" \
              || echo "report-ci-error: post failed (best-effort, ignored)"
          fi

  # report —— hosted 伴生作业（2026-09-06 加固轮，Task 4）。覆盖「runner 已死」场景：
  #   verify 作业里的 Task-3b 回流步跑在同一台 self-hosted 机器上，若整机 OOM/掉线，那一步
  #   根本没机会执行。本作业跑在 GitHub 托管 runner（公共 fork 免费，实证见 run 33262256989），
  #   needs: verify + if: always()，只用 API（gh）读 verify 的 job/steps 快照与日志，绝不碰
  #   持久根、不占本机 runner slot。判据：verify 终态但本轮时间窗内 PR 无任何 ^VERDICT:(PASS|FAIL)
  #   结论（既非绿也无 FAIL 评论）→ 贴 VERDICT: INFRA（首条 ::error::/error: 行 + job 链接）。
  #   幂等：与 3b 复用同一 marker（只含 run=）——机内已贴过就**不重复贴**，且只有「机内那条的
  #   错误行是占位串、而本作业从日志里真拉到了错误行」时才 PATCH 升级；否则原样保留（绝不把
  #   机内步锚定好的归因降级）。成功路径（有真 PASS）直接跳过。
  report:
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: "Detect missing verdict and file VERDICT: INFRA (hosted)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          VERIFY_STATUS: ${{ needs.verify.result }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "$PR" ]; then
            echo "report: no PR number in this context (not a PR-scoped run) -- nothing to do"
            exit 0
          fi
          # 1) 时间窗内已有真结论 → 不抢通道，直接跳过（含成功路径）。
          #    fail-closed（2026-09-07）：created_at 或探测本身取不到（API 抖动/限流）时站开
          #    不贴——盲探拿到空串等价于「不知道」，此时贴 INFRA 有盖住真结论的风险。
          RUN_CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .created_at)
          if [ -z "$RUN_CREATED" ]; then
            echo "report: cannot read this run's created_at (API failure) -- standing down (fail-closed)"
            exit 0
          fi
          HAS_VERDICT=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments,reviews \
            | jq --arg since "$RUN_CREATED" \
            '[.comments[],.reviews[] | select((.createdAt // .submittedAt) >= $since) | .body | split("\n")[0] | select(test("^VERDICT: *(PASS|FAIL)"))] | length')
          case "$HAS_VERDICT" in
            ''|*[!0-9]*)
              echo "report: verdict probe failed (got '$HAS_VERDICT') -- standing down (fail-closed, no INFRA on an unknown)"
              exit 0;;
          esac
          if [ "$HAS_VERDICT" -gt 0 ]; then
            echo "report: real PASS|FAIL verdict present in this run's window -- stands down (verify=$VERIFY_STATUS)"
            exit 0
          fi
          # 2) verify 若成功收尾（result=success）却查不到结论，属门禁/通道异常，仍按 INFRA 报；
          #    真正的正常绿一定有 PASS 评论，已在 ① 命中。这里只处理「无结论的终态」。
          #    定位 verify job id 与失败步——必须限定 run_attempt：重跑（attempt+1）时 jobs 接口
          #    会同时给出历次 attempt 的 job，不加限定会拿到上一 attempt 的旧 job/旧日志。
          mapfile -t VJ < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            | jq -r --arg att "$ATTEMPT" \
              '.jobs[] | select(.name=="verify" and ((.run_attempt|tostring) == $att)) | "\(.id) \(.conclusion)"')
          VER_JOB_ID="${VJ[0]%% *}"; VER_CONC="${VJ[0]##* }"
          [ -z "$VER_CONC" ] && VER_CONC="$VERIFY_STATUS"
          STEPFAIL=""
          if [ -n "$VER_JOB_ID" ]; then
            STEPFAIL=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$VER_JOB_ID" \
              --jq '[.steps[] | select(.conclusion=="failure") | .name] | first // empty')
          fi
          STEPFAIL="${STEPFAIL:-the verify job (runner may have died; job conclusion=$VER_CONC)}"
          # 3) 从 verify 日志取首条真错误行（gh api 拉 job 日志；失败则留空，仍贴带链接的 INFRA）。
          #    两条受控红实证过的口径（2026-09-07，run 34053805262）：
          #    ① job 日志在 job 结束后**几秒内可能还没上传完**（本例 report 作业起在 verify
          #      完成 4s 后，首拉为空 → 错误行退化成占位串），故带重试地拉；
          #    ② 扁平 job 日志里**没有可靠的步边界**：`##[group]` 头是脚本的**第一行**而非步名
          #      （本 workflow 四个步都以 `Run set -euo pipefail` 开头，切不出失败步片段）；
          #      而全文扫描的**第一条** error 形行往往是 runner 回显的 workflow 自身源码
          #      （`echo "::error::..."` 那些行），所以先剥掉回显前缀 `\x1b[36;1m` 的行。
          #    归因精度靠机内步（有 per-step tee 日志）；hosted 侧只在机内步没贴上时才算独立
          #    报告人，见第 5 步的站开/PATCH 分工。
          LOGF="$RUNNER_TEMP/verify-job.log"
          ERR=""
          ERR_IS_REAL=0
          strip_ansi() { sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g'; }
          ERR_RE='(::error::|[Ee]rror:|FAILED:|ninja: build stopped|CMake Error|Traceback|command not found|not on PATH|PRE-FAIL)'
          if [ -n "$VER_JOB_ID" ]; then
            for try in 1 2 3; do
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$VER_JOB_ID/logs" > "$LOGF" 2>/dev/null
              [ -s "$LOGF" ] && break
              echo "report: verify job log not ready yet (try $try) -- retrying in 15s"
              sleep 15
            done
            [ -s "$LOGF" ] && ERR=$(sed -E '/\x1b\[36;1m/d' "$LOGF" \
              | strip_ansi | grep -aE "$ERR_RE" \
              | sed -E 's/^[0-9T:.-]+Z //; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' \
              | head -1)
            [ -n "$ERR" ] && ERR_IS_REAL=1
            rm -f "$LOGF"
          fi
          [ -n "$ERR" ] || ERR="(no explicit error line retrieved from the hosted log fetch; see the job run)"
          # 错误行里的 "::error::" 之类前缀先中和（日志里的这条前缀本身可能来自 PR 内容经会话
          # 回显，不该被我们抄进评论再触发一次注解面），并截断超长行避免评论爆炸。
          ERR=$(printf '%s' "$ERR" | sed -E 's/::([a-zA-Z][a-zA-Z0-9-]*)([[:space:]][^:]*)?::/[\1] /g')
          ERR="${ERR:0:400}"
          # 4) marker 与 3b 一致（**只含 run=**，attempt 记在正文里做审计）→ 一条 run 全程
          #    最多一条 INFRA，重跑走 PATCH 更新同一条。
          MARKER="<!-- bb-verify:ci-error run=$RUN_ID -->"
          BODYF="$RUNNER_TEMP/infra-body.md"
          printf 'VERDICT: INFRA\n\n' > "$BODYF"
          printf '基础设施失败（不是 PR 内容的验证结论），由 hosted report 作业补报。消费方应**重发 dispatch**。\n\n' >> "$BODYF"
          printf -- '- verify job：%s\n' "$STEPFAIL" >> "$BODYF"
          printf -- '- 首条错误行：%s\n' "$ERR" >> "$BODYF"
          printf -- '- Run：%s (attempt %s)\n' "$JOB_URL" "$ATTEMPT" >> "$BODYF"
          printf -- '- 来源：hosted report 作业（兜底位；只有扁平 job 日志，无 per-step 边界）\n' >> "$BODYF"
          printf -- '- 语义：VERDICT: INFRA 与 PASS/FAIL 三处门禁正则排它；覆盖 runner 整机已死、机内回流步跑不到的场景。\n\n' >> "$BODYF"
          printf '%s\n' "$MARKER" >> "$BODYF"
          # 5) 写路径（2026-09-07 受控红 run 34053805262 实证后定的分工）。规则一句话：
          #    - 没有同 marker 的既有条目（机内步没跑到 / runner 整机已死）→ POST，本作业是唯一
          #      报告人，哪怕错误行只是占位串也要贴（有链接的 INFRA 胜过硬空窗）。
          #    - 已有条目：**只在「既有条目是占位错误行」且「本次拉到了真错误行」时 PATCH**（升级），
          #      否则原样保留（站开）。踩过的坑：机内步用 per-step tee 日志锚出了正确的错误行，
          #      而 hosted 侧面对的是**扁平 job 日志**（`##[group]` 头是脚本第一行而非步名，本
          #      workflow 四个可失败步都以 `Run set -euo pipefail` 开头，切不出步片段；且第一条
          #      error 形行往往是 runner 回显的 workflow 自身源码，已按 `\x1b[36;1m` 前缀剥掉），
          #      无条件 PATCH 会把好的归因**降级**——受控红里真发生了（评论 created 19:06:19Z /
          #      updated 19:06:35Z，最终正文成了 hosted 版）。
          EXIST=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            | jq -sr --arg m "bb-verify:ci-error run=$RUN_ID" \
              '[ .[][] | select(.body | contains($m)) ] | (last // empty)
               | "\(.id // "")\t\((.body | test("no (matching|explicit) error line")) | tostring)"')
          EXIST_ID="${EXIST%%$'\t'*}"; EXIST_PLACEHOLDER="${EXIST##*$'\t'}"
          if [ -n "$EXIST_ID" ]; then
            if [ "$EXIST_PLACEHOLDER" = "true" ] && [ "$ERR_IS_REAL" = "1" ]; then
              # body 必须走 --input + jq -Rs 的 JSON（gh api -f 是 raw string，**不**展开 @file，
              # 会把 "@/tmp/.../infra-body.md" 这串字面量写进评论）。
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXIST_ID" \
                --input <(jq -Rs '{body:.}' "$BODYF") >/dev/null \
                && echo "report: upgraded a placeholder INFRA comment id=$EXIST_ID (hosted log had a real error line)" \
                || echo "report: PATCH failed (best-effort)"
            else
              echo "report: INFRA comment id=$EXIST_ID already filed (existing-is-placeholder=$EXIST_PLACEHOLDER, hosted-line-is-real=$ERR_IS_REAL) -- standing down, no downgrade"
            fi
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$BODYF" \
              && echo "report: posted new hosted-side INFRA comment" \
              || echo "report: post failed (best-effort)"
          fi
